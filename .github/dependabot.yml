version: 2

updates:
  # ─── Dépendances racine + workspaces (project, task, notification) ──────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    labels:
      - dependencies

  # ─── Auth service ────────────────────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /auth-service
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    labels:
      - dependencies
      - auth-service

  # ─── Frontend ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    labels:
      - dependencies
      - frontend

  # ─── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    labels:
      - dependencies
      - github-actions
