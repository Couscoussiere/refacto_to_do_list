services:
    rabbitmq:
        image: rabbitmq:3-management
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
            interval: 10s
            timeout: 5s
            retries: 15
            start_period: 30s
        networks:
            - backend

    reverse-proxy:
        image: nginx:1.30-alpine
        ports:
            - '80:80'
        volumes:
            - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - auth-service
            - project-service
            - task-service
            - notification-service
        networks:
            - public
            - backend

    frontend:
        image: ghcr.io/couscoussiere/refacto_to_do_list/frontend:${IMAGE_TAG:-dev}
        depends_on:
            - reverse-proxy
        networks:
            - backend

    mysql-auth:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=authdb
            - MYSQL_USER=auth_user
            - MYSQL_PASSWORD=${MYSQL_AUTH_PASSWORD}
        volumes:
            - mysql-auth-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - backend

    mysql-project:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=projectdb
            - MYSQL_USER=project_user
            - MYSQL_PASSWORD=${MYSQL_PROJECT_PASSWORD}
        volumes:
            - mysql-project-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - backend

    mysql-task:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=taskdb
            - MYSQL_USER=task_user
            - MYSQL_PASSWORD=${MYSQL_TASK_PASSWORD}
        volumes:
            - mysql-task-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - backend

    auth-service:
        image: ghcr.io/couscoussiere/refacto_to_do_list/auth-service:${IMAGE_TAG:-dev}
        environment:
            - PORT=3000
            - CORS_ORIGIN=${CORS_ORIGIN}
            - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
            - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
            - JWT_EXPIRES_IN=1h
            - ADMIN_EMAIL=${ADMIN_EMAIL:-}
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
            - DB_HOST=mysql-auth
            - DB_USER=auth_user
            - DB_PASSWORD=${MYSQL_AUTH_PASSWORD}
            - DB_NAME=authdb
        depends_on:
            mysql-auth:
                condition: service_healthy
        networks:
            - backend

    project-service:
        image: ghcr.io/couscoussiere/refacto_to_do_list/project-service:${IMAGE_TAG:-dev}
        environment:
            - PORT=3001
            - CORS_ORIGIN=${CORS_ORIGIN}
            - AUTH_SERVICE_URL=http://auth-service:3000
            - TASK_SERVICE_URL=http://task-service:3002
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - DB_HOST=mysql-project
            - DB_USER=project_user
            - DB_PASSWORD=${MYSQL_PROJECT_PASSWORD}
            - DB_NAME=projectdb
        depends_on:
            rabbitmq:
                condition: service_healthy
            mysql-project:
                condition: service_healthy
            auth-service:
                condition: service_started
        networks:
            - backend

    task-service:
        image: ghcr.io/couscoussiere/refacto_to_do_list/task-service:${IMAGE_TAG:-dev}
        environment:
            - PORT=3002
            - CORS_ORIGIN=${CORS_ORIGIN}
            - PROJECT_SERVICE_URL=http://project-service:3001
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - DB_HOST=mysql-task
            - DB_USER=task_user
            - DB_PASSWORD=${MYSQL_TASK_PASSWORD}
            - DB_NAME=taskdb
        depends_on:
            rabbitmq:
                condition: service_healthy
            mysql-task:
                condition: service_healthy
            project-service:
                condition: service_started
        networks:
            - backend

    notification-service:
        image: ghcr.io/couscoussiere/refacto_to_do_list/notification-service:${IMAGE_TAG:-dev}
        environment:
            - PORT=3003
            - CORS_ORIGIN=${CORS_ORIGIN}
            - RABBITMQ_URL=amqp://rabbitmq:5672
        depends_on:
            rabbitmq:
                condition: service_healthy
        networks:
            - backend

networks:
    # Seul réseau relié à l'extérieur : uniquement le reverse-proxy
    public:
    # Backends, bases et RabbitMQ : aucun accès depuis/vers l'extérieur
    backend:
        internal: true

volumes:
    mysql-auth-data:
    mysql-project-data:
    mysql-task-data:
