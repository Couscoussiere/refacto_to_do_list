server:
  port: ${PORT:3000}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:authdb}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  # Swagger UI / openapi.json (désactivé dans l'image Docker)
  docs-enabled: ${DOCS_ENABLED:true}
  jwt:
    # Clés PEM encodées en base64 sur une seule ligne
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    expires-in: ${JWT_EXPIRES_IN:1h}
  # Compte admin créé (ou promu) au démarrage si les deux variables sont définies
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
