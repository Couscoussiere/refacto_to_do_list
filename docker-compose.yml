# Lancement de toute l'application en une commande.
#   TEST (défaut, images reconstruites) : docker compose up --build
#   UAT  : docker compose --env-file .env --env-file environments/uat.env up -d
#   PROD : docker compose --env-file .env --env-file environments/prod.env up -d
# Les secrets (mots de passe, clés JWT) sont dans .env (non versionné, modèle : .env.example).
# Les réglages propres à chaque environnement sont dans environments/<env>.env.

name: todo-${APP_ENV:-test}

# Réglages communs à tous les conteneurs
x-common: &common
    restart: ${RESTART_POLICY:-unless-stopped}
    logging:
        driver: json-file
        options:
            max-size: '10m'
            max-file: '3'

# Durcissement des conteneurs applicatifs (ils tournent tous en non-root)
x-hardened: &hardened
    security_opt:
        - no-new-privileges:true
    cap_drop:
        - ALL

x-mysql-healthcheck: &mysql-healthcheck
    test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s

x-mysql-limits: &mysql-limits
    resources:
        limits:
            cpus: '${DB_CPUS:-1}'
            memory: ${DB_MEMORY:-768M}

x-node-limits: &node-limits
    resources:
        limits:
            cpus: '${NODE_CPUS:-0.5}'
            memory: ${NODE_MEMORY:-256M}

services:
    rabbitmq:
        <<: *common
        image: rabbitmq:3-management
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
            interval: 10s
            timeout: 5s
            retries: 15
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: '${RABBITMQ_CPUS:-0.5}'
                    memory: ${RABBITMQ_MEMORY:-512M}
        networks:
            - backend

    reverse-proxy:
        <<: *common
        image: nginx:1.30-alpine
        ports:
            - '${HTTP_PORT:-8080}:80'
        volumes:
            - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            frontend:
                condition: service_healthy
            auth-service:
                condition: service_healthy
            project-service:
                condition: service_healthy
            task-service:
                condition: service_healthy
            notification-service:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '${PROXY_CPUS:-0.5}'
                    memory: ${PROXY_MEMORY:-128M}
        networks:
            - public
            - backend

    frontend:
        <<: [*common, *hardened]
        image: ${REGISTRY:-ghcr.io/couscoussiere/refacto_to_do_list}/frontend:${IMAGE_TAG:-dev}
        build:
            context: ./frontend
            dockerfile: Dockerfile
        healthcheck:
            test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/']
            interval: 15s
            timeout: 3s
            retries: 3
        deploy:
            resources:
                limits:
                    cpus: '${PROXY_CPUS:-0.5}'
                    memory: ${PROXY_MEMORY:-128M}
        networks:
            - backend

    mysql-auth:
        <<: *common
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD?MYSQL_ROOT_PASSWORD manquant dans .env}
            - MYSQL_DATABASE=authdb
            - MYSQL_USER=auth_user
            - MYSQL_PASSWORD=${MYSQL_AUTH_PASSWORD?MYSQL_AUTH_PASSWORD manquant dans .env}
        volumes:
            - mysql-auth-data:/var/lib/mysql
        healthcheck: *mysql-healthcheck
        deploy: *mysql-limits
        networks:
            - backend

    mysql-project:
        <<: *common
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD?MYSQL_ROOT_PASSWORD manquant dans .env}
            - MYSQL_DATABASE=projectdb
            - MYSQL_USER=project_user
            - MYSQL_PASSWORD=${MYSQL_PROJECT_PASSWORD?MYSQL_PROJECT_PASSWORD manquant dans .env}
        volumes:
            - mysql-project-data:/var/lib/mysql
        healthcheck: *mysql-healthcheck
        deploy: *mysql-limits
        networks:
            - backend

    mysql-task:
        <<: *common
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD?MYSQL_ROOT_PASSWORD manquant dans .env}
            - MYSQL_DATABASE=taskdb
            - MYSQL_USER=task_user
            - MYSQL_PASSWORD=${MYSQL_TASK_PASSWORD?MYSQL_TASK_PASSWORD manquant dans .env}
        volumes:
            - mysql-task-data:/var/lib/mysql
        healthcheck: *mysql-healthcheck
        deploy: *mysql-limits
        networks:
            - backend

    auth-service:
        <<: [*common, *hardened]
        image: ${REGISTRY:-ghcr.io/couscoussiere/refacto_to_do_list}/auth-service:${IMAGE_TAG:-dev}
        build:
            context: ./auth-service
        environment:
            - PORT=3000
            - CORS_ORIGIN=${CORS_ORIGIN}
            - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY?JWT_PRIVATE_KEY manquant dans .env}
            - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY?JWT_PUBLIC_KEY manquant dans .env}
            - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
            - ADMIN_EMAIL=${ADMIN_EMAIL:-}
            - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
            - DB_HOST=mysql-auth
            - DB_USER=auth_user
            - DB_PASSWORD=${MYSQL_AUTH_PASSWORD}
            - DB_NAME=authdb
            - DOCS_ENABLED=${DOCS_ENABLED:-true}
            # La JVM n'utilise par défaut que 25 % de la limite mémoire du conteneur
            - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
        healthcheck:
            test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/health']
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 40s
        depends_on:
            mysql-auth:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '${AUTH_CPUS:-1}'
                    memory: ${AUTH_MEMORY:-768M}
        networks:
            - backend

    project-service:
        <<: [*common, *hardened]
        image: ${REGISTRY:-ghcr.io/couscoussiere/refacto_to_do_list}/project-service:${IMAGE_TAG:-dev}
        build:
            context: .
            dockerfile: project-service/Dockerfile
        environment:
            - NODE_ENV=${NODE_ENV:-test}
            - PORT=3001
            - CORS_ORIGIN=${CORS_ORIGIN}
            - AUTH_SERVICE_URL=http://auth-service:3000
            - TASK_SERVICE_URL=http://task-service:3002
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - DB_HOST=mysql-project
            - DB_USER=project_user
            - DB_PASSWORD=${MYSQL_PROJECT_PASSWORD}
            - DB_NAME=projectdb
        healthcheck:
            test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3001/health']
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 20s
        depends_on:
            rabbitmq:
                condition: service_healthy
            mysql-project:
                condition: service_healthy
            auth-service:
                condition: service_healthy
        deploy: *node-limits
        networks:
            - backend

    task-service:
        <<: [*common, *hardened]
        image: ${REGISTRY:-ghcr.io/couscoussiere/refacto_to_do_list}/task-service:${IMAGE_TAG:-dev}
        build:
            context: .
            dockerfile: task-service/Dockerfile
        environment:
            - NODE_ENV=${NODE_ENV:-test}
            - PORT=3002
            - CORS_ORIGIN=${CORS_ORIGIN}
            - PROJECT_SERVICE_URL=http://project-service:3001
            - RABBITMQ_URL=amqp://rabbitmq:5672
            - DB_HOST=mysql-task
            - DB_USER=task_user
            - DB_PASSWORD=${MYSQL_TASK_PASSWORD}
            - DB_NAME=taskdb
        healthcheck:
            test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3002/health']
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 20s
        depends_on:
            rabbitmq:
                condition: service_healthy
            mysql-task:
                condition: service_healthy
            project-service:
                condition: service_healthy
        deploy: *node-limits
        networks:
            - backend

    notification-service:
        <<: [*common, *hardened]
        image: ${REGISTRY:-ghcr.io/couscoussiere/refacto_to_do_list}/notification-service:${IMAGE_TAG:-dev}
        build:
            context: .
            dockerfile: notification-service/Dockerfile
        environment:
            - NODE_ENV=${NODE_ENV:-test}
            - PORT=3003
            - CORS_ORIGIN=${CORS_ORIGIN}
            - RABBITMQ_URL=amqp://rabbitmq:5672
        healthcheck:
            test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3003/health']
            interval: 15s
            timeout: 3s
            retries: 3
            start_period: 20s
        depends_on:
            rabbitmq:
                condition: service_healthy
        deploy: *node-limits
        networks:
            - backend

networks:
    # Seul réseau relié à l'extérieur : uniquement le reverse-proxy
    public:
    # Backends, bases et RabbitMQ : aucun accès depuis/vers l'extérieur
    backend:
        internal: true

volumes:
    mysql-auth-data:
    mysql-project-data:
    mysql-task-data:
